name = "cwb"
main = "index.js"
compatibility_date = "2026-11-07"

# Self-hosted theme assets (Bootstrap, jQuery, editor.md, etc.) so the
# site does not depend on third-party CDNs. Requests matching a file
# under public/ are served by the edge; everything else goes to the Worker.
[assets]
directory = "public"

